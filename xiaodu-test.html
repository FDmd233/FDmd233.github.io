<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Xiaodu Settings Test</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:0 auto;padding:28px 18px;line-height:1.55}
    h1{font-size:1.45rem}
    p{color:#444}
    a.btn{display:block;margin:14px 0;padding:16px;border:1px solid #bbb;border-radius:10px;text-decoration:none;color:#111;background:#fafafa;font-size:1.05rem}
    code{word-break:break-all}
    .note{font-size:.92rem;color:#666}
  </style>
</head>
<body>
  <h1>小度 WebView 设置跳转测试</h1>
  <p>这些按钮只尝试调用 Android 系统设置 Activity，不安装应用、不修改系统文件。</p>

  <a class="btn" href="intent:#Intent;action=android.settings.SETTINGS;package=com.android.settings;end">1. 打开系统设置</a>
  <a class="btn" href="intent:#Intent;action=android.settings.APPLICATION_DEVELOPMENT_SETTINGS;package=com.android.settings;end">2. 打开开发者选项</a>
  <a class="btn" href="intent:#Intent;action=android.settings.APPLICATION_SETTINGS;package=com.android.settings;end">3. 打开应用管理</a>
  <a class="btn" href="intent:#Intent;action=android.settings.WIFI_SETTINGS;package=com.android.settings;end">4. 打开 Wi-Fi 设置</a>
  <a class="btn" href="intent:#Intent;action=android.settings.MANAGE_UNKNOWN_APP_SOURCES;package=com.android.settings;end">5. 打开未知来源设置</a>

  <p class="note">如果按钮完全没有反应，说明当前 WebView 很可能拦截了外部 intent scheme；如果弹出“无法打开”，也请记下原文。</p>
</body>
</html>
